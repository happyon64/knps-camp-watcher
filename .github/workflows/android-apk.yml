name: Build Android watcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-project-fixed.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack Android project
        run: unzip -q android-project-fixed.zip -d android-build

      - name: Build debug APK
        working-directory: android-build
        run: gradle --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: guryong-camp-watcher-apk
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
