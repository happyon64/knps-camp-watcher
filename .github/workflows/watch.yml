name: Check Guryong campsite

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guryong-campsite-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore monitor state
        uses: actions/cache@v4
        with:
          path: .monitor-data
          key: monitor-state-${{ github.run_id }}
          restore-keys: |
            monitor-state-

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Random polite delay
        run: sleep $((RANDOM % 46))

      - name: Check availability and notify
        env:
          DATA_DIR: .monitor-data
          HEADLESS: "true"
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: node src/once.js
