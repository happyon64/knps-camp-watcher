<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#176b3a" />
    <title>구룡야영장 빈자리 알림</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background:#f4f7f4; color:#17231c }
      body { margin:0; padding:20px; }
      main { max-width:620px; margin:auto; }
      h1 { font-size:1.55rem; margin:8px 0 18px; }
      .card { background:white; padding:18px; border-radius:16px; margin:12px 0; box-shadow:0 4px 20px #163b2412; }
      .label { color:#607066; font-size:.84rem; }
      .value { margin:4px 0 14px; font-weight:650; }
      .status { display:inline-block; padding:5px 10px; border-radius:999px; background:#e8f5ec; color:#176b3a; font-weight:700; }
      button,a.button { width:100%; box-sizing:border-box; display:block; border:0; border-radius:12px; padding:14px; margin-top:10px; text-align:center; text-decoration:none; font-weight:750; font-size:1rem; cursor:pointer; }
      .primary { background:#176b3a; color:white; }
      .kakao { background:#fee500; color:#191919; }
      .secondary { background:#edf1ee; color:#243329; }
      pre { white-space:pre-wrap; overflow-wrap:anywhere; font:inherit; font-size:.9rem; }
      #message { min-height:24px; color:#176b3a; font-weight:650; }
    </style>
  </head>
  <body>
    <main>
      <h1>🏕 구룡야영장 빈자리 알림</h1>
      <section class="card">
        <div class="label">일정</div><div class="value">2026. 9. 4. → 9. 6. (2박)</div>
        <div class="label">대상</div><div class="value">카라반 1~14호 · 하우스 1~3</div>
        <div class="label">현재 상태</div><div id="status" class="status">불러오는 중</div>
        <pre id="details"></pre>
      </section>
      <section class="card">
        <a id="connect" class="button kakao" href="/api/kakao/connect">카카오톡 연결</a>
        <button id="test" class="secondary">카카오톡 시험 알림</button>
        <button id="run" class="primary">지금 확인</button>
        <p id="message"></p>
      </section>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const format = (iso) => iso ? new Date(iso).toLocaleString("ko-KR") : "아직 없음";
      async function refresh() {
        const data = await fetch("/api/status").then((r) => r.json());
        const m = data.monitor;
        $("connect").textContent = data.kakaoConnected ? "카카오톡 다시 연결" : "카카오톡 연결";
        $("status").textContent = m.running ? "확인 중" : m.scheduleOpen ? "9월 일정 공개됨" : "9월 일정 공개 대기";
        $("details").textContent = [
          `카카오톡: ${data.kakaoConnected ? "연결됨" : "연결 필요"}`,
          `마지막 정상 확인: ${format(m.lastSuccessAt)}`,
          `다음 확인: ${format(m.nextCheckAt)}`,
          `발견 시설: ${m.matchingFacilities.length ? m.matchingFacilities.join(", ") : "없음"}`,
          m.lastError ? `오류: ${m.lastError}` : ""
        ].filter(Boolean).join("\n");
      }
      async function post(path, pending) {
        $("message").textContent = pending;
        try {
          const response = await fetch(path, { method:"POST" });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error);
          $("message").textContent = "완료되었습니다.";
          await refresh();
        } catch (error) { $("message").textContent = `실패: ${error.message}`; }
      }
      $("test").onclick = () => post("/api/test-kakao", "시험 메시지를 보내는 중…");
      $("run").onclick = () => post("/api/run", "국립공원 예약 현황을 확인하는 중…");
      refresh(); setInterval(refresh, 30000);
    </script>
  </body>
</html>
